benchmark:
  name: "ConvLSTM and MS-ConvLSTM Training"
  workdir: "./"
  cache_file: "./cache_train.db"
  cache_exclude_vars: ["results_dir", "project_dir"]
  executor: slurm
  search_method: exhaustive
  repetitions: 4
  parallel: 2
  probes:
    system_snapshot: true
    resource_sampling: true
    gpu_sampling: true
    sampling_interval: 1.0

vars:
  dataset:
    type: str
    sweep:
      mode: list
      values: ["taasrad19", "moving_mnist"]

  model_architecture:
    type: str
    sweep:
      mode: list
      values: ["convlstm", "ms_convlstm"]

  project_dir:
    type: str
    expr: "/home/jrezende/convlstm-green-ai"

  venv_dir:
    type: str
    expr: "{{ project_dir }}/.venv"

  results_dir:
    type: str
    expr: "{{ project_dir }}/experiments_results"

command:
  template: >
    "{{ venv_dir }}/bin/python" "{{ project_dir }}/trainer.py"
    --num_epochs 100
    --batch_size 10
    --working_dir {{ results_dir }}
    --start_epoch_saving 100
    --normalize_values
    --model_architecture {{ model_architecture }}
    --dataset {{ dataset }}
    --result_folder_suffix {{ model_architecture }}_{{ repetition }}

scripts:
  - name: "convlstm_train"
    submit: "bash"
    script_template: |
      #!/bin/bash
      #SBATCH --job-name={{ model_architecture }}_train_{{ dataset }}
      #SBATCH --ntasks=1
      #SBATCH --nodes=2
      #SBATCH --ntasks-per-node=1
      #SBATCH --nodelist=sirocco[23-24]
      #SBATCH --time=24:00:00
      #SBATCH -o batch%j.out
      #SBATCH -e batch%j.err
      #SBATCH --exclusive
      #SBATCH --constraint sirocco

      set -o pipefail

      module load compiler/cuda/12.3
      module load nvidia-driver-libs-plafrim/610
      module load zlib

      if [[ ! -x "{{ venv_dir }}/bin/python" ]]; then
        echo "Python virtual environment not found at {{ venv_dir }}" >&2
        exit 1
      fi

      module add compiler/gcc/11.2.0
      module add linalg/openblas/0.3.9

      {{ command.template }} 2>&1 | tee {{ execution_dir }}/train.log

    parser:
      file: "{{ results_dir }}/training_{{ dataset }}_standard_{{ model_architecture }}_{{ repetition }}/metrics/execution_metrics_training_standard_{{ dataset }}.csv"
      metrics:
        - name: total_training_time_sec
        - name: average_epoch_time_sec
        - name: min_epoch_loss
        - name: min_epoch
      parser_script: |
        import csv
        def parse(file_path):
            with open(file_path) as f:
                reader = csv.DictReader(f)
                row = next(reader)
            return {
                "total_training_time_sec": float(row["total_training_time_sec"]),
                "average_epoch_time_sec": float(row["average_epoch_time_sec"]),
                "min_epoch_loss": float(row["min_epoch_loss"]),
                "min_epoch": int(row["min_epoch"]),
            }

output:
  sink:
    type: csv
