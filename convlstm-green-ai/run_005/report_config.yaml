# IOPS Report Configuration
# This file was auto-generated based on your benchmark execution.
# Edit and use with: iops report <workdir> --report-config report_config.yaml
#
# This config is a template based on your benchmark metrics and variables.
# Customize the plots and settings, then set enabled: true to auto-generate reports.
#
# Documentation: https://lgouveia.gitlabpages.inria.fr/iops/user-guide/reporting/
#
# ============================================================================
# AVAILABLE VARIABLES AND METRICS (for use in plot configurations)
# ============================================================================
#
# Swept Variables (use for x_var, y_var, group_by, color_by):
#   - dataset (str)
#   - model_architecture (str)
#
# Benchmark Metrics (from parser scripts):
#   - total_predict_time_sec
#   - total_predict_time_with_evaluation_sec
#   - MAE
#   - MSE
#   - RMSE
#   - SSIM
#   - PSNR
#   - CSI_avg
#   - POD_avg
#   - FAR_avg
#   - HSS_avg
#
# Resource Sampling Metrics (from probes, also usable in plots):
#   - nodes_traced
#   - samples_collected
#   - mem_peak_gb
#   - mem_avg_gb
#   - mem_peak_per_node_gb
#   - cpu_avg_pct
#   - cpu_max_pct
#   - cpu_imbalance_pct
#   - trace_duration_s
#   - gpu_count
#   - gpu_samples_collected
#   - gpu0_avg_utilization_pct
#   - gpu0_avg_power_w
#   - gpu0_avg_temperature_c
#   - gpu0_mem_peak_mib
#   - gpu0_energy_j
#   - gpu1_avg_utilization_pct
#   - gpu1_avg_power_w
#   - gpu1_avg_temperature_c
#   - gpu1_mem_peak_mib
#   - gpu1_energy_j
#   - gpu_avg_utilization_pct
#   - gpu_max_utilization_pct
#   - gpu_avg_mem_utilization_pct
#   - gpu_mem_peak_mib
#   - gpu_avg_temperature_c
#   - gpu_max_temperature_c
#   - gpu_avg_power_w
#   - gpu_max_power_w
#   - gpu_energy_j
#   - gpu_trace_duration_s
#
# Plot Types Available:
#   - bar, line, scatter, heatmap, box, violin, surface_3d
#   - parallel_coordinates, execution_scatter, coverage_heatmap
#
# Colors:
#   - 24 distinct colors are auto-generated by default
#   - To customize, add under theme: colors: ["#hex1", "#hex2", ...]
#
# ============================================================================

reporting:
  enabled: false
  output_filename: analysis_report.html
  theme:
    style: plotly_white
  sections:
    test_summary: true
    best_results: true
    variable_impact: true
    custom_plots: true
  metrics:
    total_predict_time_sec:
      plots:
      - type: line
        x_var: dataset
        group_by: model_architecture
      - type: heatmap
        x_var: dataset
        y_var: model_architecture
